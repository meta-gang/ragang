<text x="996" y="293.0" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="25" fill="#172b4d">실시간 대시보드</text>
<text x="996" y="334.5" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="22" fill="#172b4d">질문 성공·실패 · 지표별 수치</text>
<text x="996" y="368.0" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" fill="#52647b">흐름 그래프 · 반복 · 실패 지점</text>
<rect x="972" y="420" width="420" height="166" rx="14" fill="#fff" stroke="#d5dee9"/>
<text x="996" y="466.0" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="25" fill="#172b4d">같은 질문의 실행 비교</text>
<text x="996" y="507.6" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="21" fill="#172b4d">평가 조건 · 유효 표본 확인</text>
<text x="996" y="551.8" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20" fill="#52647b">주장 → 판정 → 문서 근거</text>
<rect x="972" y="624" width="420" height="100" rx="14" fill="#fff" stroke="#d5dee9"/>
<text x="996" y="666.2" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="24" fill="#172b4d">이력 복원 · 다음 실험</text>
<text x="996" y="702.8" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20" fill="#52647b">설정 한 가지 변경 후 다시 검증</text>
<path d="M930 318 L972 318" stroke="#64748b" stroke-width="3" fill="none"/>
