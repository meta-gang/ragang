<rect x="48" y="770" width="1344" height="72" rx="12" fill="#eaf2fd" stroke="#c9d9ed"/>
<text x="72" y="812.3" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="23" fill="#172b4d">평가 성공률 ≠ 정답률    ·    지표의 단위·방향 유지    ·    Gold 없이 얻은 증거의 범위를 명시</text>
