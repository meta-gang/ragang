<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RAG 실행</title>
    <style>
        table { border-collapse: collapse; width: 80%; margin-top: 30px; }
        body { font-family: Arial, sans-serif; margin: 40px; text-align: center; }
        input[type="file"] { margin: 10px; }
        #status { margin-top: 20px; font-weight: bold; color: green; }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: skyblue;
        }
    </style>
</head>

<body>
    <h1>RAG 설정</h1>
    <table>
        <p>아래 3개의 파일을 모두 업로드한 뒤, <br/><b>"RAG 실행"</b> 버튼을 눌러주세요.</p>
    </table>

    <div>
        <label>분석 대상 문서 (.txt):</label><br/>
        <input type="file" id="docFile" accept=".txt" /><br/>

        <label>API 설정 파일 (.json):</label><br/>
        <input type="file" id="apiFile" accept=".json" /><br/>

        <label>Query 목록 파일 (.txt):</label><br/>
        <input type="file" id="queryFile" accept=".txt" /><br/>
    </div>

    <button onclick="runRAG()">RAG 실행</button>

    <div id="status">파일을 형식에 맞춰서 업로드해주세요</div>

    <script>
        function runRAG() {
            var docFile = document.getElementById("docFile").files.length > 0;
            var apiFile = document.getElementById("apiFile").files.length > 0;
            var queryFile = document.getElementById("queryFile").files.length > 0;

            if (docFile && apiFile && queryFile) {
                document.getElementById("status").innerText = "RAG 실행 중... 결과 페이지로 이동합니다.";
                setTimeout(function () {
                    window.location.href = "rag_result.html";
                }, 1000);
            } else {
                document.getElementById("status").innerText = "모든 파일들을 형식에 맞춰 업로드해주세요!";
            }
        }
    </script>
</body>
</html>
